name: Publish

on:
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (must already exist, e.g. 2.5.0)"
        required: true
        type: string
      publish_pypi:
        description: "Publish package to PyPI"
        required: false
        type: boolean
        default: true
      build_docs:
        description: "Build and deploy docs"
        required: false
        type: boolean
        default: true
      build_docker:
        description: "Build and push Docker images"
        required: false
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve version and ref
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
            REF="refs/tags/${{ inputs.tag }}"
          else
            VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
            REF="${{ github.ref }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  publish-package:
    needs: prepare
    if: ${{ github.event_name == 'release' || inputs.publish_pypi }}
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - uses: actions/checkout@v2
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install Dependencies
        run: | 
          poetry install
      - name: Build
        run: poetry build
      - name: Publish
        run: poetry publish -u "${{ secrets.PYPI_LOGIN }}" -p "${{ secrets.PYPI_PASS }}"

  build-docs:
    needs: [prepare, publish-package]
    if: ${{ always() && !failure() && !cancelled() && (github.event_name == 'release' || inputs.build_docs) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-docs-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: |
          poetry install -E "all docs" -vv
      - name: Install apt docs dependencies
        run: |
          sudo apt install pandoc
          sudo apt install s3cmd
      - name: Build docs
        run: |
          cd docs
          poetry run make build-docs
          mv build/html/ ../site
        env:
          CI_COMMIT_SHORT_SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
      - name: Deploy to s3
        run: |
          echo "${{ secrets.DOCS_S3CMD_CONFIG }}" > .s3cfg
          s3cmd -c .s3cfg rm -r "s3://docs.etna.ai/stable/"
          s3cmd -c .s3cfg put --recursive --guess-mime-type --no-mime-magic ./site/ "s3://docs.etna.ai/stable/"
          VERSION="${{ needs.prepare.outputs.version }}"
          s3cmd -c .s3cfg rm -r "s3://docs.etna.ai/$VERSION/"
          s3cmd -c .s3cfg put --recursive --guess-mime-type --no-mime-magic ./site/ "s3://docs.etna.ai/$VERSION/"

  docker-build-and-push:
    needs: [prepare, publish-package]
    if: ${{ always() && !failure() && !cancelled() && (github.event_name == 'release' || inputs.build_docker) }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - {"name": etna-cpu, "path": docker/etna-cpu/Dockerfile}
          - {"name": etna-cuda-12.4.0, "path": docker/etna-cuda-12.4.0/Dockerfile}

    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: |
          poetry install -E all -vv
      - name: Build image
        run: |
          cd $( dirname ${{ matrix.dockerfile.path }})
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "etna[all]==$VERSION" > requirements.txt
          poetry export -E "all jupyter" --without-hashes --format=requirements.txt >> requirements.txt
          cat requirements.txt
          docker build . --tag image
      - name: Log into registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}/${{ matrix.dockerfile.name }}
          VERSION="${{ needs.prepare.outputs.version }}"
          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag image $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
